<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FLXPOD OS">
<title>FLXPOD OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}

/* ═══════════════════════════════════════
   SETUP MODE
   ═══════════════════════════════════════ */
.setup{
  display:flex;flex-direction:column;
  height:100%;padding:20px 24px 24px;gap:0;overflow-y:auto;
}
.setup-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:clamp(12px,2vh,20px);
  border-bottom:1px solid rgba(255,255,255,.06);
  margin-bottom:clamp(16px,3vh,28px);
}
.setup-logo{
  height:clamp(32px,4.5vw,48px);width:auto;object-fit:contain;
}
.setup-status{
  font-size:12px;font-weight:700;letter-spacing:.12em;color:#555;
}
.setup-body{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;
}
.setup-preview{
  text-align:center;margin-bottom:clamp(20px,3vh,36px);
}
.setup-preview-time{
  font-family:"Orbitron",sans-serif;
  font-size:clamp(48px,10vw,96px);font-weight:900;
  letter-spacing:.04em;line-height:1;color:rgba(255,255,255,.3);
  font-variant-numeric:tabular-nums;
}
.setup-preview-label{
  font-size:12px;font-weight:700;letter-spacing:.2em;color:#444;
  margin-top:8px;text-transform:uppercase;
}
.setup-section{
  width:100%;max-width:400px;margin-bottom:clamp(16px,2.5vh,28px);
}
.setup-section h2{
  font-size:12px;font-weight:700;letter-spacing:.18em;color:#555;
  margin-bottom:10px;text-transform:uppercase;
}
.duration-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;
}
.dur-btn{
  -webkit-appearance:none;appearance:none;
  border:1.5px solid rgba(255,255,255,.1);border-radius:12px;
  background:transparent;color:rgba(255,255,255,.5);
  padding:14px 0;font-size:15px;font-weight:700;letter-spacing:.04em;
  cursor:pointer;transition:all .15s;
}
.dur-btn:active{transform:scale(.97)}
.dur-btn.selected{
  border-color:rgba(255,255,255,.5);
  background:rgba(255,255,255,.08);
  color:#fff;
}
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);
}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:14px;font-weight:600;color:#777;letter-spacing:.01em}
.switch{
  width:46px;height:26px;border-radius:999px;
  background:rgba(255,255,255,.1);position:relative;
  border:none;cursor:pointer;transition:background .2s;flex-shrink:0;
}
.switch::after{
  content:"";position:absolute;width:20px;height:20px;
  top:3px;left:3px;border-radius:50%;background:#444;
  transition:all .15s ease;
}
.switch.on{background:rgba(255,255,255,.22)}
.switch.on::after{left:23px;background:#fff}
.start-btn{
  -webkit-appearance:none;appearance:none;border:none;
  width:100%;max-width:400px;padding:18px 0;
  border-radius:14px;font-size:16px;font-weight:800;
  letter-spacing:.15em;cursor:pointer;
  background:#fff;color:#000;
  transition:all .15s;margin-top:clamp(8px,1.5vh,16px);
}
.start-btn:active{transform:scale(.98);opacity:.9}
.setup-footer{
  width:100%;text-align:center;padding-top:clamp(10px,2vh,16px);
  border-top:1px solid rgba(255,255,255,.04);
}
.setup-footer-text{
  font-size:11px;font-weight:600;letter-spacing:.1em;color:#333;
}

/* ═══════════════════════════════════════
   TV MODE
   ═══════════════════════════════════════ */
.tv{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  height:100%;width:100%;position:relative;
  padding:5%;
}
.tv-logo{
  height:clamp(60px,14vh,180px);width:auto;max-width:50vw;
  object-fit:contain;opacity:.9;
  margin-bottom:clamp(8px,1.5vh,24px);
}
.tv-clock{
  font-family:"Orbitron",sans-serif;
  font-size:clamp(100px,22vw,440px);
  font-weight:900;line-height:1;
  transition:color .3s;
  display:flex;align-items:baseline;justify-content:center;
}
.digit{
  display:inline-block;width:.65em;text-align:center;
}
.sep{
  display:inline-block;width:.3em;text-align:center;
}
.tv-bar-wrap{
  width:clamp(200px,55vw,900px);height:8px;
  margin-top:clamp(14px,2.5vh,40px);
  border-radius:99px;background:rgba(255,255,255,.07);
  overflow:hidden;
}
.tv-bar{
  width:0%;height:100%;border-radius:99px;
  background:#fff;transition:width .12s linear;
}
.tv-round{
  position:absolute;
  bottom:clamp(14px,3vh,36px);right:clamp(16px,3vw,44px);
  font-size:clamp(13px,1.4vw,22px);font-weight:600;
  letter-spacing:.12em;color:rgba(255,255,255,.35);
}
.tv-localtime{
  position:absolute;
  bottom:clamp(14px,3vh,36px);left:clamp(16px,3vw,44px);
  font-size:clamp(13px,1.4vw,22px);font-weight:600;
  letter-spacing:.06em;color:rgba(255,255,255,.35);
  font-variant-numeric:tabular-nums;
}

/* Timer color states */
.tv.state-warning .tv-clock{color:#ffd21f}
.tv.state-warning .tv-bar{background:#ffd21f}
.tv.state-critical .tv-clock{color:#ff2e2e}
.tv.state-critical .tv-bar{background:#ff2e2e}

/* ═══════════════════════════════════════
   TRANSITION SCREEN
   ═══════════════════════════════════════ */
.transition{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  height:100%;width:100%;position:relative;padding:5%;
}
.transition-logo{
  height:clamp(60px,14vh,180px);width:auto;max-width:50vw;
  object-fit:contain;opacity:.9;
  position:absolute;top:clamp(20px,5%,60px);left:50%;transform:translateX(-50%);
}
.transition-text{
  text-align:center;line-height:1.15;
}
.transition-text .line1{
  display:block;
  font-size:clamp(40px,8vw,130px);font-weight:900;letter-spacing:.1em;
}
.transition-text .line2{
  display:block;
  font-size:clamp(40px,8vw,130px);font-weight:900;letter-spacing:.1em;
}

/* ═══════════════════════════════════════
   SOUND UNLOCK OVERLAY
   ═══════════════════════════════════════ */
.sound-unlock{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.94);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;cursor:pointer;
}
.sound-unlock .unlock-icon{font-size:56px}
.sound-unlock .unlock-text{
  font-size:clamp(18px,3vw,28px);font-weight:700;
  letter-spacing:.08em;text-align:center;padding:0 20px;
}
.sound-unlock .unlock-sub{
  font-size:clamp(12px,1.6vw,16px);color:#555;font-weight:600;letter-spacing:.04em;
}
.sound-unlock.hidden{display:none}

/* Back button (TV mode) */
.tv-back{
  position:absolute;
  top:clamp(14px,3vh,36px);left:clamp(16px,3vw,44px);
  -webkit-appearance:none;appearance:none;border:none;
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.4);
  width:44px;height:44px;border-radius:50%;
  font-size:22px;line-height:44px;text-align:center;
  cursor:pointer;transition:all .2s;z-index:10;
}
.tv-back:active{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
</style>
</head>
<body>

<!-- SOUND UNLOCK -->
<div class="sound-unlock" id="soundUnlock">
  <div class="unlock-icon">🔊</div>
  <div class="unlock-text">TAP TO ENABLE SOUND</div>
  <div class="unlock-sub">Required on iPad / iPhone</div>
</div>

<!-- SETUP MODE -->
<div class="setup" id="setupScreen">
  <div class="setup-header">
    <img class="setup-logo" id="setupLogo" alt="FLXPOD OS" src="">
    <span class="setup-status" id="setupTime"></span>
  </div>

  <div class="setup-body">
    <div class="setup-preview">
      <div class="setup-preview-time" id="previewTime">15:00</div>
      <div class="setup-preview-label">SELECTED DURATION</div>
    </div>

    <div class="setup-section">
      <h2>Duration</h2>
      <div class="duration-grid">
        <button class="dur-btn" id="btn1">1</button>
        <button class="dur-btn" id="btn3">3</button>
        <button class="dur-btn" id="btn5">5</button>
        <button class="dur-btn selected" id="btn15">15</button>
      </div>
    </div>

    <div class="setup-section">
      <h2>Audio</h2>
      <div class="toggle-row">
        <span class="toggle-label">One Minute Warning</span>
        <div class="switch on" id="toggleMinute"></div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Switch Evolutions</span>
        <div class="switch on" id="toggleSwitchEvo"></div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Sound</span>
        <div class="switch on" id="toggleSound"></div>
      </div>
    </div>

    <button class="start-btn" id="startSession">START SESSION</button>
  </div>

  <div class="setup-footer">
    <span class="setup-footer-text">AUTO RECYCLE ENABLED · TIMER REPEATS INDEFINITELY</span>
  </div>
</div>

<!-- TV MODE -->
<div class="tv" id="tvScreen">
  <button class="tv-back" id="backBtn">&#x2190;</button>
  <img class="tv-logo" id="tvLogo" alt="FLXPOD OS" src="">
  <div class="tv-clock" id="clock"><span class="digit">1</span><span class="digit">5</span><span class="sep">:</span><span class="digit">0</span><span class="digit">0</span></div>
  <div class="tv-bar-wrap"><div class="tv-bar" id="bar"></div></div>
  <div class="tv-localtime" id="localTime"></div>
  <div class="tv-round" id="roundDisplay">ROUND 1</div>
</div>


<!-- TRANSITION SCREEN -->
<div class="transition" id="transitionScreen">
  <img class="transition-logo" id="transitionLogo" alt="FLXPOD OS" src="">
  <div class="transition-text">
    <span class="line1">SWITCH</span>
    <span class="line2">EVOLUTIONS</span>
  </div>
</div>

// ── State ──
var durationSeconds=15*60;
var remainingSeconds=durationSeconds;
var running=false;
var intervalId=null;
var lastTick=null;
var rounds=0;
var oneMinuteSaid=false;
var lastBeepSecond=-1;
var audioCtx=null;
var audioUnlocked=false;
var wakeLock=null;

// ── DOM refs ──
function $(id){return document.getElementById(id)}
var setupScreen=$("setupScreen");
var tvScreen=$("tvScreen");
var transitionScreen=$("transitionScreen");
var clockEl=$("clock");
var barEl=$("bar");
var roundEl=$("roundDisplay");
var soundOverlay=$("soundUnlock");

// ── Audio unlock (iOS requirement) ──
function doUnlockAudio(){
  if(audioUnlocked)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      audioCtx=new AC();
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      g.gain.value=0.3;o.frequency.value=440;o.type="sine";
      o.connect(g);g.connect(audioCtx.destination);
      o.start(0);o.stop(audioCtx.currentTime+0.12);
    }
  }catch(e){}
  try{
    if("speechSynthesis"in window){
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance("Sound enabled.");
      u.volume=1;u.rate=1;u.lang="en-US";
      var voices=window.speechSynthesis.getVoices();
      for(var i=0;i<voices.length;i++){if(voices[i].lang.indexOf("en")===0){u.voice=voices[i];break}}
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
  audioUnlocked=true;
  soundOverlay.classList.add("hidden");
}
soundOverlay.addEventListener("click",doUnlockAudio);
soundOverlay.addEventListener("touchend",function(e){e.preventDefault();doUnlockAudio()});

// Preload voices
if("speechSynthesis"in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices()};
}

// ── Wake Lock ──
function requestWakeLock(){
  try{if("wakeLock"in navigator)navigator.wakeLock.request("screen").then(function(wl){wakeLock=wl;wl.addEventListener("release",function(){wakeLock=null})}).catch(function(){})}catch(e){}
}
function releaseWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&running)requestWakeLock()});

// ── Helpers ──
function isOn(id){return $(id).className.indexOf("on")!==-1}
function toggleSwitch(id){var el=$(id);el.className=el.className.indexOf("on")!==-1?"switch":"switch on"}

function fmtPlain(t){
  t=Math.max(0,Math.ceil(t));
  var m=Math.floor(t/60),s=t%60;
  return(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function fmtDigits(t){
  t=Math.max(0,Math.ceil(t));
  var m=Math.floor(t/60),s=t%60;
  var ms=(m<10?"0":"")+m,ss=(s<10?"0":"")+s;
  return'<span class="digit">'+ms[0]+'</span><span class="digit">'+ms[1]+'</span><span class="sep">:</span><span class="digit">'+ss[0]+'</span><span class="digit">'+ss[1]+'</span>';
}

// ── Audio ──
function beepTone(freq,dur){
  try{
    if(!audioCtx)return;
    if(audioCtx.state==="suspended")audioCtx.resume();
    var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type="square";osc.frequency.value=freq;
    var t=audioCtx.currentTime;
    gain.gain.setValueAtTime(0.01,t);
    gain.gain.linearRampToValueAtTime(0.5,t+0.03);
    gain.gain.linearRampToValueAtTime(0.01,t+(dur||0.4));
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(t);osc.stop(t+(dur||0.4)+0.01);
  }catch(e){}
}

function beep(){
  if(!isOn("toggleSound"))return;
  beepTone(880,0.2);
  setTimeout(function(){beepTone(1100,0.2)},220);
  setTimeout(function(){beepTone(1320,0.3)},440);
}

function say(text){
  if(!isOn("toggleSound"))return;
  beepTone(660,0.2);
  setTimeout(function(){
    try{
      if(!("speechSynthesis"in window))return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.rate=0.9;u.pitch=0.85;u.volume=1;u.lang="en-US";
      var voices=window.speechSynthesis.getVoices();
      for(var i=0;i<voices.length;i++){
        if(voices[i].lang.indexOf("en")===0&&voices[i].localService){u.voice=voices[i];break}
      }
      window.speechSynthesis.speak(u);
      var keepAlive=setInterval(function(){
        if(!window.speechSynthesis.speaking){clearInterval(keepAlive)}
        else{window.speechSynthesis.resume()}
      },250);
      setTimeout(function(){clearInterval(keepAlive)},10000);
    }catch(e){}
  },250);
}

// ── Screen management ──
function showSetup(){
  setupScreen.style.display="flex";
  tvScreen.style.display="none";
  transitionScreen.style.display="none";
}
function showTV(){
  setupScreen.style.display="none";
  tvScreen.style.display="flex";
  transitionScreen.style.display="none";
}
function showTransition(){
  setupScreen.style.display="none";
  tvScreen.style.display="none";
  transitionScreen.style.display="flex";
}

// ── Render ──
function render(){
  clockEl.innerHTML=fmtDigits(remainingSeconds);
  roundEl.textContent="ROUND "+rounds;
  var pct=((durationSeconds-remainingSeconds)/durationSeconds)*100;
  if(pct<0)pct=0;if(pct>100)pct=100;
  barEl.style.width=pct+"%";

  tvScreen.className="tv";
  if(running&&remainingSeconds<=10){tvScreen.className="tv state-critical"}
  else if(running&&remainingSeconds<=60){tvScreen.className="tv state-warning"}
}

// ── Timer logic ──
function startSession(){
  remainingSeconds=durationSeconds;
  rounds=1;
  oneMinuteSaid=false;lastBeepSecond=-1;
  running=true;
  lastTick=Date.now();
  render();
  showTV();
  requestWakeLock();
  // Go fullscreen
  try{
    var el=document.documentElement;
    if(el.requestFullscreen)el.requestFullscreen();
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  }catch(e){}
  intervalId=window.setInterval(tick,100);
}

function completeRound(){
  running=false;
  if(intervalId)window.clearInterval(intervalId);intervalId=null;
  beep();

  if(isOn("toggleSwitchEvo")){
    showTransition();
    setTimeout(function(){say("Switch evolutions.")},300);
    setTimeout(function(){
      rounds++;
      remainingSeconds=durationSeconds;
      oneMinuteSaid=false;lastBeepSecond=-1;
      running=true;
      lastTick=Date.now();
      render();
      showTV();
      intervalId=window.setInterval(tick,100);
    },2000);
  }else{
    rounds++;
    remainingSeconds=durationSeconds;
    oneMinuteSaid=false;lastBeepSecond=-1;
    running=true;
    lastTick=Date.now();
    render();
    intervalId=window.setInterval(tick,100);
  }
}

function tick(){
  if(!running)return;
  var now=Date.now(),elapsed=(now-lastTick)/1000;lastTick=now;
  remainingSeconds-=elapsed;
  if(remainingSeconds<=60&&remainingSeconds>0&&!oneMinuteSaid&&isOn("toggleMinute")){
    oneMinuteSaid=true;say("One minute remaining.");
  }
  if(remainingSeconds<=10&&remainingSeconds>0&&isOn("toggleSound")){
    var sec=Math.ceil(remainingSeconds);
    if(sec!==lastBeepSecond&&sec>=1&&sec<=10){
      lastBeepSecond=sec;
      beepTone(sec<=3?1200:800,0.15);
    }
  }
  if(remainingSeconds<=0){lastBeepSecond=-1;completeRound();return}
  render();
}

// ── Setup controls ──
function clearBtns(){
  $("btn1").className="dur-btn";
  $("btn3").className="dur-btn";
  $("btn5").className="dur-btn";
  $("btn15").className="dur-btn";
}
function setDuration(min){
  durationSeconds=min*60;remainingSeconds=durationSeconds;
  clearBtns();$("btn"+min).className="dur-btn selected";
  clockEl.innerHTML=fmtDigits(remainingSeconds);
  $("previewTime").textContent=fmtPlain(remainingSeconds);
}

function bind(id,fn){
  var el=$(id);if(!el)return;
  el.addEventListener("click",function(ev){ev.preventDefault();fn()});
}

bind("btn1",function(){setDuration(1)});
bind("btn3",function(){setDuration(3)});
bind("btn5",function(){setDuration(5)});
bind("btn15",function(){setDuration(15)});
bind("toggleMinute",function(){toggleSwitch("toggleMinute")});
bind("toggleSwitchEvo",function(){toggleSwitch("toggleSwitchEvo")});
bind("toggleSound",function(){toggleSwitch("toggleSound")});
bind("startSession",function(){startSession()});

// ── Back to setup ──
function exitSession(){
  running=false;
  if(intervalId)window.clearInterval(intervalId);intervalId=null;
  releaseWakeLock();
  try{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}catch(e){}
  showSetup();
}
bind("backBtn",exitSession);
document.addEventListener("keydown",function(e){if(e.key==="Escape")exitSession()});

// ── Local clock ──
var localTimeEl=$("localTime");
var setupTimeEl=$("setupTime");
function updateLocalTime(){
  var now=new Date();
  var h=now.getHours(),m=now.getMinutes(),ampm=h>=12?"PM":"AM";
  h=h%12;if(h===0)h=12;
  var str=(h<10?" ":"")+h+":"+(m<10?"0":"")+m+" "+ampm;
  localTimeEl.textContent=str;
  setupTimeEl.textContent=str;
}
updateLocalTime();
setInterval(updateLocalTime,10000);

// ── Init ──
showSetup();
})();
</script>
