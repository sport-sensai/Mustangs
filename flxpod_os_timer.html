<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FLXPOD OS">
<title>FLXPOD OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#000;color:#fff;
  font-family:"Barlow",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}

/* ═══════════════════════════════════════
   SETUP MODE
   ═══════════════════════════════════════ */
.setup{
  display:flex;flex-direction:column;
  height:100%;padding:20px 24px 24px;gap:0;overflow-y:auto;
}
.setup-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding-bottom:clamp(12px,2vh,20px);
  border-bottom:1px solid rgba(255,255,255,.06);
  margin-bottom:clamp(16px,3vh,28px);
}
.setup-logo{
  height:clamp(32px,4.5vw,48px);width:auto;object-fit:contain;
}
.setup-status{
  font-size:12px;font-weight:400;letter-spacing:.15em;color:rgba(255,255,255,.3);
}
.setup-body{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;
}
.setup-preview{
  text-align:center;margin-bottom:clamp(20px,3vh,36px);
}
.setup-preview-time{
  font-family:"Barlow",sans-serif;
  font-size:clamp(52px,11vw,100px);font-weight:500;
  letter-spacing:.05em;line-height:1;color:rgba(255,255,255,.25);
  font-variant-numeric:tabular-nums;
}
.setup-preview-label{
  font-size:11px;font-weight:400;letter-spacing:.25em;color:rgba(255,255,255,.2);
  margin-top:10px;text-transform:uppercase;
}
.setup-section{
  width:100%;max-width:400px;margin-bottom:clamp(16px,2.5vh,28px);
}
.setup-section h2{
  font-size:11px;font-weight:500;letter-spacing:.2em;color:rgba(255,255,255,.3);
  margin-bottom:10px;text-transform:uppercase;
}
.duration-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;
}
.dur-btn{
  -webkit-appearance:none;appearance:none;
  border:1px solid rgba(255,255,255,.08);border-radius:6px;
  background:transparent;color:rgba(255,255,255,.4);
  padding:14px 0;font-family:"Barlow",sans-serif;
  font-size:15px;font-weight:500;letter-spacing:.06em;
  cursor:pointer;transition:all .15s;
}
.dur-btn:active{transform:scale(.97)}
.dur-btn.selected{
  border-color:rgba(255,255,255,.3);
  background:rgba(255,255,255,.05);
  color:#fff;
}
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.03);
}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:14px;font-weight:400;color:rgba(255,255,255,.4);letter-spacing:.02em}
.switch{
  width:42px;height:24px;border-radius:999px;
  background:rgba(255,255,255,.08);position:relative;
  border:none;cursor:pointer;transition:background .2s;flex-shrink:0;
}
.switch::after{
  content:"";position:absolute;width:18px;height:18px;
  top:3px;left:3px;border-radius:50%;background:rgba(255,255,255,.25);
  transition:all .15s ease;
}
.switch.on{background:rgba(255,255,255,.18)}
.switch.on::after{left:21px;background:#fff}
.start-btn{
  -webkit-appearance:none;appearance:none;border:none;
  width:100%;max-width:400px;padding:16px 0;
  border-radius:6px;font-family:"Barlow",sans-serif;
  font-size:14px;font-weight:600;
  letter-spacing:.2em;cursor:pointer;
  background:#fff;color:#000;
  transition:all .15s;margin-top:clamp(8px,1.5vh,16px);
}
.start-btn:active{transform:scale(.98);opacity:.9}
.setup-footer{
  width:100%;text-align:center;padding-top:clamp(10px,2vh,16px);
  border-top:1px solid rgba(255,255,255,.03);
}
.setup-footer-text{
  font-size:10px;font-weight:400;letter-spacing:.15em;color:rgba(255,255,255,.15);
}

/* ═══════════════════════════════════════
   TV MODE
   ═══════════════════════════════════════ */
.tv{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  height:100%;width:100%;position:relative;
  padding:2% 5% 12%;
}
.tv-logo{
  height:clamp(70px,22vh,280px);width:auto;max-width:55vw;
  object-fit:contain;opacity:.7;
  margin-bottom:clamp(4px,1vh,16px);
}
.tv-clock{
  font-family:"Barlow",sans-serif;
  font-size:clamp(100px,22vw,420px);
  font-weight:500;line-height:1;
  letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
  transition:color .3s;
}
.tv-bar-wrap{
  width:clamp(200px,50vw,800px);height:3px;
  margin-top:clamp(12px,2.5vh,32px);
  border-radius:2px;background:rgba(255,255,255,.06);
  overflow:hidden;
}
.tv-bar{
  width:0%;height:100%;border-radius:2px;
  background:rgba(255,255,255,.7);transition:width .12s linear;
}
.tv-info{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(24px,5vw,72px);
  margin-top:clamp(10px,2vh,28px);
}
.tv-info span{
  font-size:clamp(11px,1.1vw,17px);font-weight:400;
  letter-spacing:.18em;color:rgba(255,255,255,.2);
  font-variant-numeric:tabular-nums;text-transform:uppercase;
}

/* Timer color states */
.tv.state-warning .tv-clock{color:#f5c518}
.tv.state-warning .tv-bar{background:#f5c518}
.tv.state-critical .tv-clock{color:#e8271b}
.tv.state-critical .tv-bar{background:#e8271b}

/* ═══════════════════════════════════════
   TRANSITION SCREEN
   ═══════════════════════════════════════ */
.transition{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  height:100%;width:100%;position:relative;padding:5%;
}
.transition-logo{
  height:clamp(70px,22vh,280px);width:auto;max-width:55vw;
  object-fit:contain;opacity:.7;
  position:absolute;top:clamp(20px,5%,60px);left:50%;transform:translateX(-50%);
}
.transition-text{
  text-align:center;line-height:1.15;
}
.transition-text .line1{
  display:block;
  font-size:clamp(40px,8vw,130px);font-weight:600;letter-spacing:.12em;
}
.transition-text .line2{
  display:block;
  font-size:clamp(40px,8vw,130px);font-weight:600;letter-spacing:.12em;
}

/* ═══════════════════════════════════════
   SOUND UNLOCK OVERLAY
   ═══════════════════════════════════════ */
.sound-unlock{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.96);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;cursor:pointer;
}
.sound-unlock .unlock-icon{font-size:48px;opacity:.6}
.sound-unlock .unlock-text{
  font-size:clamp(16px,2.5vw,24px);font-weight:500;
  letter-spacing:.15em;text-align:center;padding:0 20px;
}
.sound-unlock .unlock-sub{
  font-size:clamp(11px,1.4vw,14px);color:rgba(255,255,255,.3);
  font-weight:400;letter-spacing:.08em;
}
.sound-unlock.hidden{display:none}

/* Back button (TV mode) */
.tv-back{
  position:absolute;
  top:clamp(14px,3vh,36px);left:clamp(16px,3vw,44px);
  -webkit-appearance:none;appearance:none;
  border:none;background:transparent;
  color:rgba(255,255,255,.2);
  padding:8px 4px;
  font-family:"Barlow",sans-serif;
  font-size:13px;font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;
  cursor:pointer;transition:color .2s;z-index:10;
}
.tv-back:active{color:rgba(255,255,255,.5)}
</style>
</head>

      audioCtx=new AC();
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      g.gain.value=0.3;o.frequency.value=440;o.type="sine";
      o.connect(g);g.connect(audioCtx.destination);
      o.start(0);o.stop(audioCtx.currentTime+0.12);
    }
  }catch(e){}
  try{
    if("speechSynthesis"in window){
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance("Sound enabled.");
      u.volume=1;u.rate=1;u.lang="en-US";
      var voices=window.speechSynthesis.getVoices();
      for(var i=0;i<voices.length;i++){if(voices[i].lang.indexOf("en")===0){u.voice=voices[i];break}}
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
  audioUnlocked=true;
  soundOverlay.classList.add("hidden");
}
soundOverlay.addEventListener("click",doUnlockAudio);
soundOverlay.addEventListener("touchend",function(e){e.preventDefault();doUnlockAudio()});

// Preload voices
if("speechSynthesis"in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices()};
}

// ── Wake Lock ──
function requestWakeLock(){
  try{if("wakeLock"in navigator)navigator.wakeLock.request("screen").then(function(wl){wakeLock=wl;wl.addEventListener("release",function(){wakeLock=null})}).catch(function(){})}catch(e){}
}
function releaseWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&running)requestWakeLock()});

// ── Helpers ──
function isOn(id){return $(id).className.indexOf("on")!==-1}
function toggleSwitch(id){var el=$(id);el.className=el.className.indexOf("on")!==-1?"switch":"switch on"}

function fmtPlain(t){
  t=Math.max(0,Math.ceil(t));
  var m=Math.floor(t/60),s=t%60;
  return(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}

// ── Audio ──
function beepTone(freq,dur){
  try{
    if(!audioCtx)return;
    if(audioCtx.state==="suspended")audioCtx.resume();
    var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type="square";osc.frequency.value=freq;
    var t=audioCtx.currentTime;
    gain.gain.setValueAtTime(0.01,t);
    gain.gain.linearRampToValueAtTime(0.5,t+0.03);
    gain.gain.linearRampToValueAtTime(0.01,t+(dur||0.4));
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(t);osc.stop(t+(dur||0.4)+0.01);
  }catch(e){}
}

function beep(){
  if(!isOn("toggleSound"))return;
  beepTone(880,0.2);
  setTimeout(function(){beepTone(1100,0.2)},220);
  setTimeout(function(){beepTone(1320,0.3)},440);
}

function say(text){
  if(!isOn("toggleSound"))return;
  beepTone(660,0.2);
  setTimeout(function(){
    try{
      if(!("speechSynthesis"in window))return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.rate=0.9;u.pitch=0.85;u.volume=1;u.lang="en-US";
      var voices=window.speechSynthesis.getVoices();
      for(var i=0;i<voices.length;i++){
        if(voices[i].lang.indexOf("en")===0&&voices[i].localService){u.voice=voices[i];break}
      }
      window.speechSynthesis.speak(u);
      var keepAlive=setInterval(function(){
        if(!window.speechSynthesis.speaking){clearInterval(keepAlive)}
        else{window.speechSynthesis.resume()}
      },250);
      setTimeout(function(){clearInterval(keepAlive)},10000);
    }catch(e){}
  },250);
}

// ── Screen management ──
function showSetup(){
  setupScreen.style.display="flex";
  tvScreen.style.display="none";
  transitionScreen.style.display="none";
}
function showTV(){
  setupScreen.style.display="none";
  tvScreen.style.display="flex";
  transitionScreen.style.display="none";
}
function showTransition(){
  setupScreen.style.display="none";
  tvScreen.style.display="none";
  transitionScreen.style.display="flex";
}

// ── Render ──
function render(){
  clockEl.textContent=fmtPlain(remainingSeconds);
  roundEl.textContent="ROUND "+rounds;
  var pct=((durationSeconds-remainingSeconds)/durationSeconds)*100;
  if(pct<0)pct=0;if(pct>100)pct=100;
  barEl.style.width=pct+"%";

  tvScreen.className="tv";
  if(running&&remainingSeconds<=10){tvScreen.className="tv state-critical"}
  else if(running&&remainingSeconds<=60){tvScreen.className="tv state-warning"}
}

// ── Timer logic ──
function startSession(){
  remainingSeconds=durationSeconds;
  rounds=1;
  oneMinuteSaid=false;lastBeepSecond=-1;
  running=true;
  lastTick=Date.now();
  render();
  showTV();
  requestWakeLock();
  // Go fullscreen
  try{
    var el=document.documentElement;
    if(el.requestFullscreen)el.requestFullscreen();
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  }catch(e){}
  intervalId=window.setInterval(tick,100);
}

function completeRound(){
  running=false;
  if(intervalId)window.clearInterval(intervalId);intervalId=null;
  beep();

  if(isOn("toggleSwitchEvo")){
    showTransition();
    setTimeout(function(){say("Switch evolutions.")},300);
    setTimeout(function(){
      rounds++;
      remainingSeconds=durationSeconds;
      oneMinuteSaid=false;lastBeepSecond=-1;
      running=true;
      lastTick=Date.now();
      render();
      showTV();
      intervalId=window.setInterval(tick,100);
    },2000);
  }else{
    rounds++;
    remainingSeconds=durationSeconds;
    oneMinuteSaid=false;lastBeepSecond=-1;
    running=true;
    lastTick=Date.now();
    render();
    intervalId=window.setInterval(tick,100);
  }
}

function tick(){
  if(!running)return;
  var now=Date.now(),elapsed=(now-lastTick)/1000;lastTick=now;
  remainingSeconds-=elapsed;
  if(remainingSeconds<=60&&remainingSeconds>0&&!oneMinuteSaid&&isOn("toggleMinute")){
    oneMinuteSaid=true;say("One minute remaining.");
  }
  if(remainingSeconds<=10&&remainingSeconds>0&&isOn("toggleSound")){
    var sec=Math.ceil(remainingSeconds);
    if(sec!==lastBeepSecond&&sec>=1&&sec<=10){
      lastBeepSecond=sec;
      beepTone(sec<=3?1200:800,0.15);
    }
  }
  if(remainingSeconds<=0){lastBeepSecond=-1;completeRound();return}
  render();
}

// ── Setup controls ──
function clearBtns(){
  $("btn1").className="dur-btn";
  $("btn3").className="dur-btn";
  $("btn5").className="dur-btn";
  $("btn15").className="dur-btn";
}
function setDuration(min){
  durationSeconds=min*60;remainingSeconds=durationSeconds;
  clearBtns();$("btn"+min).className="dur-btn selected";
  clockEl.textContent=fmtPlain(remainingSeconds);
  $("previewTime").textContent=fmtPlain(remainingSeconds);
}

function bind(id,fn){
  var el=$(id);if(!el)return;
  el.addEventListener("click",function(ev){ev.preventDefault();fn()});
}

bind("btn1",function(){setDuration(1)});
bind("btn3",function(){setDuration(3)});
bind("btn5",function(){setDuration(5)});
bind("btn15",function(){setDuration(15)});
bind("toggleMinute",function(){toggleSwitch("toggleMinute")});
bind("toggleSwitchEvo",function(){toggleSwitch("toggleSwitchEvo")});
bind("toggleSound",function(){toggleSwitch("toggleSound")});
bind("startSession",function(){startSession()});

// ── Back to setup ──
function exitSession(){
  running=false;
  if(intervalId)window.clearInterval(intervalId);intervalId=null;
  releaseWakeLock();
  try{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}catch(e){}
  showSetup();
}
bind("backBtn",exitSession);
document.addEventListener("keydown",function(e){if(e.key==="Escape")exitSession()});

// ── Local clock ──
var localTimeEl=$("localTime");
var setupTimeEl=$("setupTime");
function updateLocalTime(){
  var now=new Date();
  var h=now.getHours(),m=now.getMinutes(),ampm=h>=12?"PM":"AM";
  h=h%12;if(h===0)h=12;
  var str=(h<10?" ":"")+h+":"+(m<10?"0":"")+m+" "+ampm;
  localTimeEl.textContent=str;
  setupTimeEl.textContent=str;
}
updateLocalTime();
setInterval(updateLocalTime,10000);

// ── Init ──
showSetup();
})();
</script>
